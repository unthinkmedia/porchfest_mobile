<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5efdf">
    <meta name="description" content="Porchfest Mobile is coming soon. A little music. A little neighborhood. Something good is on the way.">
    <title>Porchfest Mobile — Coming soon</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5efdf;
        --ink: #243e32;
        --accent: #b74429;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        padding: clamp(24px, 5vw, 72px);
        background: var(--paper);
        color: var(--ink);
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
      }

      header, footer {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        line-height: 1.6;
      }

      header {
        padding-bottom: 18px;
        border-bottom: 1px solid var(--ink);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      main {
        width: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 64px 0 80px;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 24px 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(64px, 13vw, 176px);
        font-weight: normal;
        line-height: 0.88;
        letter-spacing: -0.065em;
      }

      h1 span { display: block; }
      h1 em { color: var(--accent); font-weight: normal; }

      .description {
        max-width: 430px;
        margin: 32px 0 0;
        font-size: clamp(14px, 2vw, 17px);
        line-height: 1.8;
      }

      footer {
        padding-top: 18px;
        border-top: 1px solid var(--ink);
      }

      a { color: inherit; text-underline-offset: 4px; }
      a:hover { color: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    </style>
  </head>
  <body>
    <header>
      <span>Porchfest / Mobile</span>
      <span>A neighborhood in tune.</span>
    </header>
    <main>
      <p class="eyebrow">Something good is on the way</p>
      <h1><span>Front porch.</span><span>Front <em>row.</em></span></h1>
      <p class="description">A little music. A little neighborhood.<br>We're building something for Porchfest.<br>Check back soon.</p>
    </main>
    <footer>
      <span>Coming soon.</span>
      <a href="https://github.com/unthinkmedia/porchfest_mobile">Follow the build on GitHub &rarr;</a>
    </footer>
  </body>
</html>
